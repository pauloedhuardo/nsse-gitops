apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nsse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    application: not-so-simple-ecommerce
spec:
  project: default

  source:
    repoURL: https://github.com/pauloedhuardo/nsse-gitops.git
    targetRevision: main
    path: production

  destination:
    server: https://kubernetes.default.svc
    namespace: nsse

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
