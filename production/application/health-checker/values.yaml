healthCheckerDeployment:
  image: 495624154773.dkr.ecr.us-east-1.amazonaws.com/nsse/production/health-checker
  imagePullSecrets: nsse-ecr-image-pull-credentials-prod
  containerPort: 4443
  nodePort: 30005
  configMap: nsse-config-map-prod
  replicaCount: 1
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  securityContext:
        runAsUser: 1000
        runAsGroup: 1000
  serviceAccount: nsse-sa-prod
  volumes:
  - name: kestrel
    secret:
      secretName: nsse-kestrel-certificate-prod
  volumeMounts:
  - name: kestrel
    mountPath: /nsse-backend/certificates/kestrel
    readOnly: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    httpGet:
      path: /healthchecks/health
      port: 4443
      scheme: HTTPS
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 120
    timeoutSeconds: 15
    periodSeconds: 60
  readinessProbe:
    httpGet:
      path: /healthchecks/health
      port: 4443
      scheme: HTTPS
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 3
    timeoutSeconds: 15
    periodSeconds: 3