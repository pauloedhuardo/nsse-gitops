apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.identityServerDeployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    blueGreen:
      activeService: {{ .Values.identityServerDeployment.activeService }}
      previewService: {{ .Values.identityServerDeployment.previewService }}
      autoPromotionEnabled: {{ .Values.identityServerDeployment.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.identityServerDeployment.blueGreen.scaleDownDelaySeconds }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      topologySpreadConstraints:
      {{- range .Values.identityServerDeployment.topologySpreadConstraints }}
      - maxSkew:  {{ .maxSkew }}
        topologyKey: {{ .topologyKey }}
        whenUnsatisfiable: {{ .whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            app: {{ $.Release.Name }}
        # Conta o spread por revisao. Sem isso o blue e o green somam no mesmo
        # dominio e o preview fica Pending quando ha menos zonas que revisoes.
        matchLabelKeys:
        - rollouts-pod-template-hash
      {{- end }}
      securityContext:
        {{- toYaml .Values.identityServerDeployment.securityContext | nindent 8}}
      serviceAccount: {{ .Values.identityServerDeployment.serviceAccount }}
      volumes:
        {{- toYaml .Values.identityServerDeployment.volumes | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.identityServerDeployment.imagePullSecrets }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.identityServerDeployment.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.identityServerDeployment.containerPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.identityServerDeployment.configMap }}
        volumeMounts:
          {{- toYaml .Values.identityServerDeployment.volumeMounts | nindent 8}}
        resources:
          {{- toYaml .Values.identityServerDeployment.resources | nindent 10}}
        livenessProbe:
          {{- toYaml .Values.identityServerDeployment.livenessProbe | nindent 10}}
        readinessProbe:
          {{- toYaml .Values.identityServerDeployment.readinessProbe | nindent 10}}
