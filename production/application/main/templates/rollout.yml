apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.mainDeployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    blueGreen:
      activeService: {{ .Values.mainDeployment.activeService }}
      previewService: {{ .Values.mainDeployment.previewService }}
      autoPromotionEnabled: {{ .Values.mainDeployment.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.mainDeployment.blueGreen.scaleDownDelaySeconds }}
      prePromotionAnalysis:
        templates:
        - templateName: {{ .Values.mainDeployment.blueGreen.prePromotionAnalysisTemplate }}
        args:
        - name: service-name
          value: {{ .Values.mainDeployment.previewService }}
        - name: service-namespace
          value: {{ .Release.Namespace }}
        - name: service-port
          value: "{{ .Values.mainDeployment.containerPort }}"
        - name: health-path
          value: {{ .Values.mainDeployment.livenessProbe.httpGet.path }}
        - name: scheme
          value: {{ .Values.mainDeployment.livenessProbe.httpGet.scheme | lower }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      topologySpreadConstraints:
      {{- range .Values.mainDeployment.topologySpreadConstraints }}
      - maxSkew:  {{ .maxSkew }}
        topologyKey: {{ .topologyKey }}
        whenUnsatisfiable: {{ .whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            app: {{ $.Release.Name }}
        # Conta o spread por revisao. Sem isso o blue e o green somam no mesmo
        # dominio e o preview fica Pending quando ha menos zonas que revisoes.
        matchLabelKeys:
        - rollouts-pod-template-hash
      {{- end }}
      securityContext:
        {{- toYaml .Values.mainDeployment.securityContext | nindent 8}}
      serviceAccount: {{ .Values.mainDeployment.serviceAccount }}
      volumes:
        {{- toYaml .Values.mainDeployment.volumes | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.mainDeployment.imagePullSecrets }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.mainDeployment.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.mainDeployment.containerPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.mainDeployment.configMap }}
        volumeMounts:
          {{- toYaml .Values.mainDeployment.volumeMounts | nindent 8}}
        resources:
          {{- toYaml .Values.mainDeployment.resources | nindent 10}}
        livenessProbe:
          {{- toYaml .Values.mainDeployment.livenessProbe | nindent 10}}
        readinessProbe:
          {{- toYaml .Values.mainDeployment.readinessProbe | nindent 10}}
