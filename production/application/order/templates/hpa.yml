apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: {{ .Values.orderDeployment.rolloutName }}
  minReplicas: {{ .Values.orderDeployment.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.orderDeployment.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.orderDeployment.autoscaling.averageCpuUtilization }}
  behavior:
    scaleDown:
      {{- toYaml .Values.orderDeployment.autoscaling.scaleDown | nindent 6}}
    scaleUp:
      {{- toYaml .Values.orderDeployment.autoscaling.scaleUp | nindent 6}}