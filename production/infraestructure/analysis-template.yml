apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-health-check
  namespace: nsse
spec:
  # Template padrao para todas as workloads: bate no endpoint de health do
  # servico (preview, no caso do blue/green) e so libera a promocao se a
  # resposta for 200 com corpo "Healthy".
  args:
  - name: service-name
  - name: service-namespace
    value: nsse
  - name: service-port
    value: "4443"
  - name: health-path
    value: /health
  - name: scheme
    value: https
  metrics:
  - name: http-health-check
    count: 6
    interval: 10s
    # O controller troca o selector do service de preview no mesmo instante em que
    # cria o ReplicaSet. Sem espera, a primeira medicao sai antes do endpoint estar
    # programado e pendura ate o timeout. Foi o que abortou a revisao 2 do main.
    initialDelay: 30s
    # failureLimit cobre o successCondition (corpo != "Healthy"), ou seja Failures.
    failureLimit: 1
    # Timeout, conexao recusada e resposta fora do 2xx viram Error, nao Failure, e
    # sao governados aqui - failureLimit nao os cobre. O default e 4; com count: 6
    # seis respostas 500 seguidas passariam sem abortar. Em 2, tolera-se um blip
    # transitorio e exige-se 3 erros consecutivos (30s indisponivel) para abortar.
    consecutiveErrorLimit: 2
    successCondition: result == "Healthy"
    provider:
      web:
        url: "{{args.scheme}}://{{args.service-name}}.{{args.service-namespace}}.svc.cluster.local:{{args.service-port}}{{args.health-path}}"
        method: GET
        timeoutSeconds: 15
        # Certificado do Kestrel e self-signed e nao cobre o DNS do service.
        insecure: true
        # Corpo: {"status":"Healthy","totalDuration":"...","entries":{}} — extrai so o status.
        jsonPath: "{$.status}"
